services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: customs_compliance_server
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./server:/app/server
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./extracted_data:/app/extracted_data
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: customs_compliance_client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
