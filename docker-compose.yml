version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: customs_compliance_server
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./server:/app
      - ./uploads:/app/uploads
      - ./extracted_data:/app/extracted_data
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: customs_compliance_client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - server
    restart: unless-stopped
