[project]
name = "export-customs-compliance-server"
version = "1.0.0"
description = "FastAPI Backend for Export Customs Documentation Compliance Checker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.25.0",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "pinecone>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
